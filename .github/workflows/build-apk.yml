name: Build & Release Android APK

on:
  push:
    branches:
      - main
      - master
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Release Tag Name (e.g., v1.0.0)"
        required: false
        default: "v1.0.0"

permissions:
  contents: write

jobs:
  build-apk:
    name: Build Debug APK & Publish Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "21"
          cache: "gradle"

      - name: Accept Android SDK Licenses
        run: |
          ANDROID_SDK_DIR="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          mkdir -p "${ANDROID_SDK_DIR}/licenses"
          printf "\n24333f8a63b6825ea9c5514f83c2829b004d1fee\nd56f5187479451eabf01fb78af6dfcb131a6481e\n24333f8a63b6825ea9c5514f83c2829b004d1fee" > "${ANDROID_SDK_DIR}/licenses/android-sdk-license"
          printf "\n84831b9409646a918e30573bab4c9c91346d8abd\n504667f4c0de7af1a06de9f4b1727b84351f2910" > "${ANDROID_SDK_DIR}/licenses/android-sdk-preview-license"

      - name: Make gradlew Executable
        run: chmod +x ./gradlew

      - name: Prepare debug.keystore for SigningConfig
        run: |
          if [ ! -f "debug.keystore" ]; then
            if [ -f "debug.keystore.base64" ]; then
              echo "Decoding debug.keystore from debug.keystore.base64..."
              tr -d '\r\n ' < debug.keystore.base64 | base64 -d > debug.keystore
            else
              echo "Generating debug.keystore with keytool..."
              keytool -genkeypair \
                -v \
                -keystore debug.keystore \
                -storepass android \
                -alias androiddebugkey \
                -keypass android \
                -keyalg RSA \
                -keysize 2048 \
                -validity 10000 \
                -dname "CN=Android Debug,O=Android,C=US"
            fi
          fi

      - name: Ensure .env.example Exists
        run: |
          if [ ! -f ".env.example" ]; then
            touch .env.example
          fi

      - name: Provision Sherpa-ONNX v2.0.1 Linux x64 JNI for Host Unit Tests
        continue-on-error: true
        run: |
          mkdir -p /tmp/sherpa_linux_jni
          curl -fSL --retry 3 "https://github.com/k2-fsa/sherpa-onnx/releases/download/v2.0.1/sherpa-onnx-v2.0.1-linux-x64-jni.tar.bz2" -o /tmp/sherpa_linux_jni/sherpa.tar.bz2
          python3 -c 'import tarfile; tarfile.open("/tmp/sherpa_linux_jni/sherpa.tar.bz2", "r:bz2").extractall("/tmp/sherpa_linux_jni")'

      - name: Run JVM & Robolectric Unit Tests
        run: ./gradlew testDebugUnitTest --no-daemon --stacktrace

      - name: Build Debug APK with Gradle Wrapper
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Verify Packaged arm64-v8a Sherpa-ONNX Native Libraries in APK
        run: |
          python3 -c '
          import zipfile
          apk = "app/build/outputs/apk/debug/app-debug.apk"
          with zipfile.ZipFile(apk, "r") as zf:
              names = set(zf.namelist())
              for req in [
                  "lib/arm64-v8a/libsherpa-onnx-jni.so",
                  "lib/arm64-v8a/libonnxruntime.so",
                  "lib/arm64-v8a/libsherpa-onnx-c-api.so",
                  "lib/arm64-v8a/libsherpa-onnx-cxx-api.so",
              ]:
                  assert req in names, f"Missing required native library in APK: {req}"
                  info = zf.getinfo(req)
                  assert info.file_size > 100000, f"Native library {req} is unexpectedly small: {info.file_size}"
                  print(f"Verified in APK: {req} ({info.file_size} bytes)")
          '

      - name: Prepare Renamed APK for Release
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk GameVox-Hindi-v1.0-debug.apk

      - name: Upload APK as Workflow Artifact
        uses: actions/upload-artifact@v4
        with:
          name: GameVox-Hindi-APK
          path: |
            GameVox-Hindi-v1.0-debug.apk
            app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Create or Update GitHub Release with APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_type == 'tag' && github.ref_name || github.event.inputs.release_tag || format('v1.0.{0}', github.run_number) }}
          name: "GameVox Hindi APK Release (${{ github.ref_type == 'tag' && github.ref_name || github.event.inputs.release_tag || format('v1.0.{0}', github.run_number) }})"
          body: |
            ### GameVox Hindi — Automated Android APK Build
            - **Commit**: `${{ github.sha }}`
            - **Features**: Direct In-Process Sherpa-ONNX v2.0.1 Supertonic 3 Hindi Neural TTS (`arm64-v8a`), 24 Character Voice Profiles (`SID 0–4` Female F1–F5, `SID 5–9` Male M1–M5), 10-Voice Preview Matrix, Floating Overlay (`WindowManager`), MediaProjection Screen Capture, Google ML Kit OCR & Offline Hindi Translation.
          files: |
            GameVox-Hindi-v1.0-debug.apk
            app/build/outputs/apk/debug/app-debug.apk
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
